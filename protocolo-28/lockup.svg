<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none" role="img" aria-label="Erior">
  <defs>
    <linearGradient id="foil" x1="70" y1="40" x2="330" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#c8ffde"/>
      <stop offset=".38" stop-color="#7effb2"/>
      <stop offset=".52" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#ff6ba8"/>
      <stop offset=".86" stop-color="#5ef6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="steel" x1="200" y1="8" x2="200" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8d8de"/>
      <stop offset=".22" stop-color="#3a3a42"/>
      <stop offset=".45" stop-color="#f7f7fb"/>
      <stop offset=".6" stop-color="#121216"/>
      <stop offset="1" stop-color="#6a6a72"/>
    </linearGradient>
    <linearGradient id="mesh" x1="200" y1="20" x2="200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset=".4" stop-color="#101014"/>
      <stop offset="1" stop-color="#1c1c22"/>
    </linearGradient>
    <radialGradient id="canL" cx="34%" cy="36%" r="72%">
      <stop offset="0" stop-color="#6a6a74"/>
      <stop offset=".22" stop-color="#242428"/>
      <stop offset=".55" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="canR" cx="70%" cy="32%" r="72%">
      <stop offset="0" stop-color="#7a7a84"/>
      <stop offset=".24" stop-color="#26262c"/>
      <stop offset=".58" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>

  <!-- steel frame -->
  <path d="M86 158 C86 28 314 28 314 158" stroke="url(#steel)" stroke-width="9" stroke-linecap="round"/>
  <path d="M90 156 C90 36 310 36 310 156" stroke="#fff" stroke-width="1" opacity=".2"/>

  <!-- mesh canopy -->
  <path d="M104 158 C104 48 296 48 296 158" stroke="url(#mesh)" stroke-width="30" stroke-linecap="round"/>
  <path d="M112 156 C112 58 288 58 288 156" stroke="#9a9aa4" stroke-width=".8" opacity=".28"/>
  <path d="M122 154 C122 68 278 68 278 154" stroke="#9a9aa4" stroke-width=".7" opacity=".2"/>
  <path d="M132 152 C132 78 268 78 268 152" stroke="#c8c8d0" stroke-width=".55" opacity=".14"/>
  <path d="M104 158 C104 48 296 48 296 158" stroke="#fff" stroke-width="1.1" opacity=".08"/>

  <!-- yokes -->
  <path d="M86 150 v28" stroke="url(#steel)" stroke-width="8" stroke-linecap="round"/>
  <path d="M314 150 v28" stroke="url(#steel)" stroke-width="8" stroke-linecap="round"/>
  <rect x="79" y="172" width="14" height="10" rx="3" fill="#1a1a1e" stroke="url(#steel)" stroke-width="1.2"/>
  <rect x="307" y="172" width="14" height="10" rx="3" fill="#1a1a1e" stroke="url(#steel)" stroke-width="1.2"/>

  <!-- ear cups: thick cans, not balls -->
  <g filter="url(#soft)">
    <ellipse cx="78" cy="228" rx="46" ry="62" fill="#070709"/>
    <ellipse cx="322" cy="228" rx="46" ry="62" fill="#070709"/>
    <ellipse cx="78" cy="228" rx="40" ry="56" fill="url(#canL)"/>
    <ellipse cx="322" cy="228" rx="40" ry="56" fill="url(#canR)"/>
  </g>
  <ellipse cx="78" cy="228" rx="40" ry="56" stroke="#fff" stroke-width="1" opacity=".16"/>
  <ellipse cx="322" cy="228" rx="40" ry="56" stroke="#fff" stroke-width="1" opacity=".18"/>
  <ellipse cx="64" cy="206" rx="12" ry="16" fill="#fff" opacity=".1"/>
  <ellipse cx="338" cy="200" rx="11" ry="15" fill="#fff" opacity=".12"/>
  <ellipse cx="94" cy="228" rx="13" ry="28" fill="#000" opacity=".35"/>
  <ellipse cx="306" cy="228" rx="13" ry="28" fill="#000" opacity=".35"/>
  <path d="M54 210 c-6 8-8 20-8 30" stroke="#fff" stroke-width="1.2" opacity=".1" stroke-linecap="round"/>
  <path d="M346 204 c6 8 8 20 8 30" stroke="#fff" stroke-width="1.2" opacity=".12" stroke-linecap="round"/>

  <!-- crown + button -->
  <rect x="354" y="204" width="10" height="26" rx="5" fill="url(#steel)"/>
  <rect x="356.5" y="208" width="5" height="8" rx="2.5" fill="#0c0c10"/>
  <rect x="36" y="218" width="9" height="16" rx="4.5" fill="#2a2a32" stroke="#6a6a74" stroke-width=".7"/>

  <!-- mark, large and centered in the opening -->
  <g transform="translate(200 196) scale(.58) translate(-256 -250)" filter="url(#glow)" stroke="url(#foil)" stroke-width="12.5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="256" cy="168" r="32"/>
    <path d="M186 292 L256 176 L326 292"/>
    <path d="M206 268 H306"/>
    <path d="M256 310 L300 354 L256 398 L212 354 Z"/>
  </g>
</svg>
