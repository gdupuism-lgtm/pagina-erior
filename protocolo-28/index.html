<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a08">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Erior Center</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=35">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="protocolo.css?v=54">
</head>
<body class="is-halt">
  <div class="sky" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="wrap">
    <section id="haltGate" class="no-print">
      <div class="card foil-card gate-box">
        <span class="kicker">Erior Center</span>
        <h2 class="sec-title">Esta app ya no existe</h2>
        <p class="sec-sub" id="haltText">El Reto de Manifestación 28 quedó cancelado. Ya no hay códigos, ni audios aquí, ni acceso. Si tenías la app en el celular, puedes borrarla.</p>
      </div>
    </section>
  </div>
  <script>
    try { localStorage.setItem('erior-p28-halt', JSON.stringify({ suspended: true, message: 'Esta app ya no existe.' })); } catch (e) {}
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
      navigator.serviceWorker.register('sw.js?v=51', { scope: './' }).catch(function () {});
    }
  </script>
</body>
</html>
