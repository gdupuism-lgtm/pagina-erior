<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Alicia Premium — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:#0a0a0c;color:#eee;min-height:100vh;padding:1.5rem}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:1.35rem;font-weight:500;margin-bottom:.25rem;color:#f5e6c8}
.sub{font-size:.78rem;color:rgba(255,255,255,.45);margin-bottom:1.5rem}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(201,160,96,.2);border-radius:14px;padding:1.25rem;margin-bottom:1rem}
label{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:.35rem}
input,textarea,select{width:100%;padding:.65rem .75rem;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#fff;font:inherit;margin-bottom:.75rem}
input:focus,textarea:focus{outline:none;border-color:rgba(201,160,96,.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.65rem 1.1rem;border-radius:999px;border:none;cursor:pointer;font:inherit;font-size:.72rem;font-weight:600;letter-spacing:.06em}
.btn-gold{color:#1a1510;background:linear-gradient(135deg,#d4af5f,#c9a060);box-shadow:0 4px 20px rgba(201,160,96,.25)}
.btn-ghost{color:rgba(255,255,255,.7);background:transparent;border:1px solid rgba(255,255,255,.15)}
.btn-danger{color:#ffb4b4;border:1px solid rgba(255,100,100,.35);background:rgba(255,80,80,.08)}
.btn-sm{padding:.4rem .75rem;font-size:.62rem}
.row-actions{display:flex;gap:.4rem;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.72rem;margin-top:.5rem}
th,td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
th{color:rgba(255,255,255,.4);font-weight:500;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em}
code{font-family:ui-monospace,monospace;color:#f5e6c8;background:rgba(201,160,96,.1);padding:.15rem .35rem;border-radius:4px}
.badge{display:inline-block;padding:.15rem .4rem;border-radius:4px;font-size:.58rem;font-weight:600}
.badge-on{background:rgba(80,200,120,.15);color:#7ddea0}
.badge-off{background:rgba(255,100,100,.12);color:#ff9999}
.msg{font-size:.75rem;margin-top:.5rem;min-height:1.2em}
.msg.err{color:#ff9999}
.msg.ok{color:#7ddea0}
#loginView{max-width:360px;margin:4rem auto 0}
.hidden{display:none!important}
.copy{cursor:pointer;opacity:.7}
.copy:hover{opacity:1}
.btn-vip{color:#1a1510;background:linear-gradient(135deg,#e8c878,#c9a060 45%,#f5e6c8 100%);border:1px solid rgba(201,160,96,.45)}
.btn-vip:hover{filter:brightness(1.06)}
#createVipActions{margin-top:.65rem}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView" class="card">
    <h1>👑 Alicia Premium Admin</h1>
    <p class="sub">Solo Pauline / equipo Erior</p>
    <label for="adminKey">Clave de administrador</label>
    <input type="password" id="adminKey" placeholder="Tu clave admin" autocomplete="current-password">
    <button type="button" class="btn btn-gold" id="btnLogin" style="width:100%">Entrar</button>
    <p class="msg err" id="loginMsg"></p>
  </div>

  <div id="panelView" class="hidden">
    <h1>👑 Códigos Alicia Premium</h1>
    <p class="sub">Genera y gestiona accesos para clientes</p>

    <div class="card">
      <h2 style="font-size:.85rem;margin-bottom:.75rem;color:#f5e6c8">Nuevo código</h2>
      <div class="grid">
        <div><label>Cliente</label><input id="fName" placeholder="María García"></div>
        <div><label>WhatsApp / email</label><input id="fContact" placeholder="+52... o email"></div>
      </div>
      <div class="grid">
        <div><label>Activaciones máx.</label><input type="number" id="fMax" value="1" min="1" max="99"></div>
        <div><label>Código personalizado (opcional)</label><input id="fCode" placeholder="Auto: ERIOR-XXXX-XXXX"></div>
      </div>
      <label>Notas internas</label>
      <textarea id="fNotes" rows="2" placeholder="Compró pack premium, pago PayPal..."></textarea>
      <button type="button" class="btn btn-gold" id="btnCreate">Generar código ✨</button>
      <p class="msg" id="createMsg"></p>
      <div id="createVipActions" class="hidden">
        <button type="button" class="btn btn-vip" id="btnDownloadNewVip">🎴 Descargar Tarjeta VIP</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <h2 style="font-size:.85rem;color:#f5e6c8">Códigos activos</h2>
        <button type="button" class="btn btn-ghost btn-sm" id="btnRefresh">Actualizar</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Cliente</th>
              <th>Usos</th>
              <th>Estado</th>
              <th>Creado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="codesBody"></tbody>
        </table>
      </div>
      <p class="msg err" id="listMsg"></p>
    </div>

    <button type="button" class="btn btn-ghost btn-sm" id="btnLogout">Cerrar sesión</button>
  </div>
</div>
<script>
(function(){
  var ADMIN_FN='/.netlify/functions/premium-admin';
  var SESSION_KEY='erior_alicia_admin_key';

  function getKey(){return sessionStorage.getItem(SESSION_KEY)||'';}
  function setKey(k){sessionStorage.setItem(SESSION_KEY,k);}
  function clearKey(){sessionStorage.removeItem(SESSION_KEY);}

  function headers(){
    return{'Content-Type':'application/json','X-Admin-Key':getKey()};
  }

  function showPanel(on){
    document.getElementById('loginView').classList.toggle('hidden',on);
    document.getElementById('panelView').classList.toggle('hidden',!on);
  }

  function fmtDate(s){
    if(!s)return '—';
    try{return new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit'});}catch(e){return s;}
  }

  function copyText(t){
    if(navigator.clipboard){navigator.clipboard.writeText(t);}
    else{window.prompt('Copia el código:',t);}
  }

  function escAttr(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  function formatCodeDisplay(code){
    return String(code||'').trim().toUpperCase().split('-').filter(Boolean).join(' - ');
  }

  function vipFilename(clientName){
    var base=String(clientName||'Cliente')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-zA-Z0-9]+/g,'-')
      .replace(/^-|-$/g,'')||'Cliente';
    return 'AliciaPremium_'+base+'.png';
  }

  var vipFontsReady=null;
  function ensureVipFonts(){
    if(vipFontsReady)return vipFontsReady;
    vipFontsReady=Promise.all([
      document.fonts.load('600 28px "Cormorant Garamond"'),
      document.fonts.load('700 64px "Syne"'),
      document.fonts.load('500 26px "Jost"'),
      document.fonts.load('600 36px "Cormorant Garamond"'),
      document.fonts.load('600 14px "Syne"'),
      document.fonts.load('400 16px "Jost"')
    ]).catch(function(){return null;});
    return vipFontsReady;
  }

  function drawStar(ctx,x,y,r){
    ctx.beginPath();
    for(var i=0;i<5;i++){
      var a=(i*4*Math.PI/5)-Math.PI/2;
      var px=x+Math.cos(a)*r;
      var py=y+Math.sin(a)*r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
  }

  async function downloadVipCard(code,clientName){
    await ensureVipFonts();
    var W=1080,H=680;
    var canvas=document.createElement('canvas');
    canvas.width=W;
    canvas.height=H;
    var ctx=canvas.getContext('2d');

    var bg=ctx.createRadialGradient(W*0.25,H*0.15,0,W*0.55,H*0.55,W*1.1);
    bg.addColorStop(0,'#222228');
    bg.addColorStop(0.45,'#101014');
    bg.addColorStop(1,'#040405');
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.globalAlpha=0.035;
    ctx.strokeStyle='#c9a060';
    ctx.lineWidth=1;
    for(var i=-H;i<W+H;i+=22){
      ctx.beginPath();
      ctx.moveTo(i,0);
      ctx.lineTo(i+H,H);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha=0.12;
    ctx.fillStyle='#d4af5f';
    [[90,110],[240,70],[920,130],[850,190],[420,45],[680,95],[1020,520],[120,580]].forEach(function(st){
      drawStar(ctx,st[0],st[1],2.2);
    });
    ctx.globalAlpha=0.08;
    [[160,200],[760,280],[980,400],[200,480]].forEach(function(st){
      ctx.beginPath();
      ctx.arc(st[0],st[1],1.2,0,Math.PI*2);
      ctx.fill();
    });
    ctx.restore();

    ctx.strokeStyle='#c9a060';
    ctx.lineWidth=3;
    ctx.strokeRect(18,18,W-36,H-36);
    ctx.strokeStyle='rgba(201,160,96,0.32)';
    ctx.lineWidth=1;
    ctx.strokeRect(30,30,W-60,H-60);

    var gold='#d4af5f';
    var champagne='#f5e6c8';

    ctx.fillStyle=gold;
    ctx.font='600 30px "Cormorant Garamond", Georgia, serif';
    ctx.fillText('✦  ERIOR CENTER',56,78);

    ctx.font='600 13px "Syne", sans-serif';
    ctx.fillStyle=champagne;
    ctx.textAlign='right';
    if(ctx.letterSpacing!==undefined)ctx.letterSpacing='0.42em';
    ctx.fillText('MEMBER',W-56,74);
    if(ctx.letterSpacing!==undefined)ctx.letterSpacing='0px';
    ctx.textAlign='left';

    ctx.font='700 62px "Syne", sans-serif';
    ctx.fillStyle=champagne;
    ctx.fillText('ALICIA PREMIUM',56,Math.round(H*0.46));

    ctx.strokeStyle='rgba(201,160,96,0.45)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(56,Math.round(H*0.46)+16);
    ctx.lineTo(340,Math.round(H*0.46)+16);
    ctx.stroke();

    ctx.font='500 24px "Jost", sans-serif';
    ctx.fillStyle='#ffffff';
    if(ctx.letterSpacing!==undefined)ctx.letterSpacing='0.2em';
    var name=String(clientName||'MIEMBRO VIP').toUpperCase();
    ctx.fillText(name,56,Math.round(H*0.46)+58);
    if(ctx.letterSpacing!==undefined)ctx.letterSpacing='0px';

    ctx.font='600 38px "Cormorant Garamond", Georgia, serif';
    ctx.fillStyle=gold;
    if(ctx.letterSpacing!==undefined)ctx.letterSpacing='0.16em';
    ctx.fillText(formatCodeDisplay(code),56,H-68);
    if(ctx.letterSpacing!==undefined)ctx.letterSpacing='0px';

    ctx.font='400 15px "Jost", sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.42)';
    ctx.textAlign='right';
    ctx.fillText('Acceso válido 30 días',W-56,H-52);
    ctx.textAlign='left';

    canvas.toBlob(function(blob){
      if(!blob)return;
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=vipFilename(clientName);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},500);
    },'image/png');
  }

  function bindVipButton(btn){
    btn.onclick=function(){
      var code=btn.getAttribute('data-vip-code');
      var name=btn.getAttribute('data-vip-name')||'Cliente';
      btn.disabled=true;
      var prev=btn.textContent;
      btn.textContent='Generando...';
      downloadVipCard(code,name).then(function(){
        btn.textContent=prev;
        btn.disabled=false;
      }).catch(function(){
        btn.textContent=prev;
        btn.disabled=false;
      });
    };
  }

  async function loadCodes(){
    var msg=document.getElementById('listMsg');
    msg.textContent='';
    msg.className='msg';
    try{
      var r=await fetch(ADMIN_FN,{headers:{'X-Admin-Key':getKey()}});
      var d=await r.json();
      if(!r.ok||!d.ok){msg.textContent=(d&&d.error)||'Error al cargar';msg.className='msg err';return;}
      var tbody=document.getElementById('codesBody');
      tbody.innerHTML='';
      (d.codes||[]).forEach(function(c){
        var tr=document.createElement('tr');
        var active=c.active!==false;
        tr.innerHTML=
          '<td><code class="copy" title="Copiar">'+c.code+'</code></td>'+
          '<td>'+(c.client_name||'—')+'<br><span style="opacity:.5;font-size:.65rem">'+(c.client_email||c.client_whatsapp||'')+'</span></td>'+
          '<td>'+(c.activation_count||0)+' / '+c.max_activations+'</td>'+
          '<td><span class="badge '+(active?'badge-on':'badge-off')+'">'+(active?'Activo':'Off')+'</span></td>'+
          '<td>'+fmtDate(c.created_at)+'</td>'+
          '<td><div class="row-actions">'+
            '<button type="button" class="btn btn-ghost btn-sm" data-copy="'+c.code+'">Copiar</button>'+
            '<button type="button" class="btn btn-vip btn-sm" data-vip-code="'+escAttr(c.code)+'" data-vip-name="'+escAttr(c.client_name||'Cliente')+'">🎴 Descargar Tarjeta VIP</button>'+
            '<button type="button" class="btn btn-danger btn-sm" data-toggle="'+c.id+'" data-active="'+(active?'0':'1')+'">'+(active?'Desactivar':'Activar')+'</button>'+
          '</div></td>';
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('[data-copy]').forEach(function(btn){
        btn.onclick=function(){copyText(btn.getAttribute('data-copy'));btn.textContent='✓';setTimeout(function(){btn.textContent='Copiar';},1200);};
      });
      tbody.querySelectorAll('[data-vip-code]').forEach(bindVipButton);
      tbody.querySelectorAll('[data-toggle]').forEach(function(btn){
        btn.onclick=function(){toggleCode(btn.getAttribute('data-toggle'),btn.getAttribute('data-active')==='1');};
      });
    }catch(e){
      msg.textContent='Sin conexión al servidor';
      msg.className='msg err';
    }
  }

  async function toggleCode(id,active){
    await fetch(ADMIN_FN,{method:'POST',headers:headers(),body:JSON.stringify({action:'toggle',id:id,active:active})});
    loadCodes();
  }

  document.getElementById('btnLogin').onclick=async function(){
    var key=document.getElementById('adminKey').value.trim();
    var msg=document.getElementById('loginMsg');
    if(!key){msg.textContent='Ingresa la clave';return;}
    setKey(key);
    try{
      var r=await fetch(ADMIN_FN,{headers:{'X-Admin-Key':key}});
      var d=await r.json();
      if(r.status===401){clearKey();msg.textContent='Clave incorrecta';return;}
      if(!r.ok){clearKey();msg.textContent=(d&&d.error)||'Error';return;}
      showPanel(true);
      loadCodes();
    }catch(e){
      clearKey();
      msg.textContent='No hay conexión. ¿Está desplegado en Netlify?';
    }
  };

  document.getElementById('btnLogout').onclick=function(){clearKey();showPanel(false);document.getElementById('adminKey').value='';};
  document.getElementById('btnRefresh').onclick=loadCodes;

  document.getElementById('btnCreate').onclick=async function(){
    var msg=document.getElementById('createMsg');
    var vipActions=document.getElementById('createVipActions');
    var btnNewVip=document.getElementById('btnDownloadNewVip');
    vipActions.classList.add('hidden');
    msg.textContent='Generando...';
    msg.className='msg';
    var body={
      action:'create',
      client_name:document.getElementById('fName').value.trim(),
      client_whatsapp:document.getElementById('fContact').value.trim(),
      notes:document.getElementById('fNotes').value.trim(),
      max_activations:parseInt(document.getElementById('fMax').value,10)||1
    };
    var custom=document.getElementById('fCode').value.trim();
    if(custom)body.code=custom;
    try{
      var r=await fetch(ADMIN_FN,{method:'POST',headers:headers(),body:JSON.stringify(body)});
      var d=await r.json();
      if(!r.ok||!d.ok){msg.textContent=(d&&d.error)||'Error';msg.className='msg err';return;}
      msg.textContent='✓ Código creado: '+d.code.code+' — cópialo y envíaselo al cliente';
      msg.className='msg ok';
      copyText(d.code.code);
      document.getElementById('fCode').value='';
      var createdCode=d.code.code;
      var createdName=body.client_name||d.code.client_name||'Cliente';
      btnNewVip.setAttribute('data-vip-code',createdCode);
      btnNewVip.setAttribute('data-vip-name',createdName);
      bindVipButton(btnNewVip);
      vipActions.classList.remove('hidden');
      loadCodes();
    }catch(e){
      msg.textContent='Error de conexión';
      msg.className='msg err';
    }
  };

  document.getElementById('adminKey').onkeydown=function(e){if(e.key==='Enter')document.getElementById('btnLogin').click();};

  if(getKey()){
    fetch(ADMIN_FN,{headers:{'X-Admin-Key':getKey()}}).then(function(r){
      if(r.ok){showPanel(true);loadCodes();}
      else clearKey();
    }).catch(function(){clearKey();});
  }
})();
</script>
</body>
</html>
