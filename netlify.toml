  to = "/en/mapa/"
  status = 301

[[redirects]]
  from = "/mapa/admin"
  to = "/mapa/admin.html"
  status = 200

[functions.mapa-unlock]
  timeout = 10

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/libro/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/admin-libro.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions.claude]
  timeout = 26

[functions.libro-validate]
  timeout = 20

[functions.libro-admin]
  timeout = 20

[functions.libro-file]
  timeout = 26

[functions.p28-api]
  timeout = 20
  external_node_modules = ["@netlify/blobs"]

[functions."p28-cron"]
  timeout = 20
  schedule = "*/15 * * * *"
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/reto-28"
  to = "/protocolo-28/"
  status = 301

[[redirects]]
  from = "/reto-28/*"
  to = "/protocolo-28/:splat"
  status = 200

[[redirects]]
  from = "/reto28"
  to = "/protocolo-28/"
  status = 301

[[redirects]]
  from = "/reto28/*"
  to = "/protocolo-28/:splat"
  status = 200

[[headers]]
  for = "/protocolo-28/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Accept-Ranges = "bytes"