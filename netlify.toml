[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/diagnostico"
  to = "/diagnostico/"
  status = 301

[[redirects]]
  from = "/oferta"
  to = "/oferta/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/oferta/"
  status = 301

[[redirects]]
  from = "/galaxy"
  to = "/galaxy/"
  status = 301

[[redirects]]
  from = "/starwars"
  to = "/galaxy/"
  status = 301

[[redirects]]
  from = "/nexo"
  to = "/nexo/"
  status = 301

[[redirects]]
  from = "/codigo"
  to = "/codigo/"
  status = 301

[[redirects]]
  from = "/sello"
  to = "/codigo/"
  status = 301

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"

[functions.claude]
  timeout = 26