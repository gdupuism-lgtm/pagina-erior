[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/diagnostico"
  to = "/diagnostico/"
  status = 301

[[redirects]]
  from = "/oferta"
  to = "/oferta/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/oferta/"
  status = 301

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"

[functions.claude]
  timeout = 26