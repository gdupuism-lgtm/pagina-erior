[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/diagnostico"
  to = "/diagnostico/"
  status = 301

[[redirects]]
  from = "/oferta"
  to = "/oferta/"
  status = 301

[[redirects]]
  from = "/story"
  to = "/oferta/"
  status = 301

[[redirects]]
  from = "/galaxy"
  to = "/galaxy/"
  status = 301

[[redirects]]
  from = "/starwars"
  to = "/galaxy/"
  status = 301

[[redirects]]
  from = "/nexo"
  to = "/nexo/"
  status = 301

[[redirects]]
  from = "/codigo"
  to = "/codigo/"
  status = 301

[[redirects]]
  from = "/sello"
  to = "/codigo/"
  status = 301

[[redirects]]
  from = "/onda"
  to = "/onda/"
  status = 301

[[redirects]]
  from = "/sintoniza"
  to = "/onda/"
  status = 301

[[redirects]]
  from = "/play"
  to = "/onda/"
  status = 301

[[redirects]]
  from = "/libro"
  to = "/libro/"
  status = 301

[[redirects]]
  from = "/mental-tech"
  to = "/libro/"
  status = 301

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/libro/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/admin-libro.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[functions]
  node_bundler = "esbuild"

[functions.claude]
  timeout = 26

[functions.libro-validate]
  timeout = 20

[functions.libro-admin]
  timeout = 20

[functions.libro-file]
  timeout = 26